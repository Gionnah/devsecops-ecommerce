name: DevSecOps CI/CD Pipeline & GitOps Trigger

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ecommerce-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ==========================================
  # 1. CODE QUALITY & SAST SCANNING
  # ==========================================
  code-security-and-tests:
    name: 🛡️ Code Security (SAST) & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install flake8 bandit safety pytest

      - name: 🔍 Linter (Flake8)
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 📦 Software Composition Analysis - SCA (Safety)
        run: |
          safety check -r src/requirements.txt --full-report || true

      - name: 🧪 Run Unit Tests (Pytest)
        run: |
          pytest tests/ -v

  # ==========================================
  # 2. SECRETS SCANNING (GITLEAKS)
  # ==========================================
  secrets-scan:
    name: 🔑 Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ==========================================
  # 3. DOCKERFILE & MANIFEST LINTING
  # ==========================================
  infrastructure-security:
    name: 🏗️ Dockerfile & K8s Manifest Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/Dockerfile
          ignore: DL3008,DL3013

      - name: ☸️ Scan K8s Manifests (Trivy Config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # ==========================================
  # 4. CONTAINER BUILD & CVE SCANNING (TRIVY)
  # ==========================================
  container-security:
    name: 📦 Container Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [code-security-and-tests, infrastructure-security]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          load: true

      - name: 🛡️ Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  # ==========================================
  # 5. GITOPS ARGO CD STATUS
  # ==========================================
  gitops-notification:
    name: 🚀 GitOps Deployment Ready
    runs-on: ubuntu-latest
    needs: [container-security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: GitOps Sync Notice
        run: |
          echo "=========================================================="
          echo "✅ DevSecOps Pipeline Passed with Success!"
          echo "Image Tag: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "ArgoCD will automatically reconcile Kubernetes cluster state."
          echo "Domain: https://www.ecommerce.lcl"
          echo "=========================================================="

