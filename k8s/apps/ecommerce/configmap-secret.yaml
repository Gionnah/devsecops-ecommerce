apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  POSTGRES_DB: "ecommerce_db"
  POSTGRES_HOST: "postgres-service.ecommerce.svc.cluster.local"
  POSTGRES_PORT: "5432"
  PORT: "5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "ecommerce_user"
  POSTGRES_PASSWORD: "EcommerceSecurePassword2026!"
  SECRET_KEY: "prod-secret-key-ecommerce-devsecops"

